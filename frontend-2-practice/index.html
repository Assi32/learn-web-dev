<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Барбершоп — Выбор времени</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="header__container">
      <a href="#" class="header__logo">Barbershop</a>
      <nav class="header__nav">
        <a href="#" class="header__link">Услуги</a>
        <a href="#" class="header__link">Мастера</a>
        <a href="#" class="header__link">Контакты</a>
      </nav>
      <a href="tel:+79990000000" class="header__phone">+7 (999) 123-45-67</a>
    </div>
  </header>

  <main class="main">
    <div class="main__container">
      <div class="steps">
        <div class="steps__item steps__item--done"><span class="steps__icon">✓</span> Услуга</div>
        <div class="steps__line"></div>
        <div class="steps__item steps__item--done"><span class="steps__icon">✓</span> Мастер</div>
        <div class="steps__line"></div>
        <div class="steps__item steps__item--active"><span class="steps__icon">3</span> Время</div>
      </div>

      <h1 class="page-title">Выбор даты и времени</h1>

      <div class="booking-grid">
        <section class="calendar">
          <div class="calendar__header">
            <button class="calendar__arrow" type="button" id="prevMonth">←</button>
            <span class="calendar__month" id="currentMonth">Октябрь 2026</span>
            <button class="calendar__arrow" type="button" id="nextMonth">→</button>
          </div>
          <div class="calendar__weekdays">
            <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
          </div>
          <div class="calendar__days" id="calendarDays"></div>
        </section>

        <section class="slots">
          <h2 class="slots__title">Свободное время</h2>
          <div class="slots__grid" id="slotsGrid"></div>
          <button class="btn-primary" type="button" id="nextBtn">Далее</button>
        </section>
      </div>

      <div class="bottom-bar" id="bottomBar">
        <span class="bottom-bar__text">Выберите дату и время</span>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer__container">
      <div class="footer__logo">Barbershop</div>
      <div class="footer__links"><a href="#">Политика конфиденциальности</a><a href="#">Оферта</a></div>
      <div class="footer__socials"><a href="#">VK</a><a href="#">TG</a></div>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
