<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание 3. Основы React</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .card { border: 1px solid #ddd; padding: 20px; border-radius: 8px; max-width: 400px; }
        button { background: #61dafb; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #21a1f1; }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        function Counter() {
            const [count, setCount] = React.useState(0);

            return (
                <div className="card">
                    <h1>Основы React</h1>
                    <p>Текущее значение: <strong>{count}</strong></p>
                    <button onClick={() => setCount(count + 1)}>
                        Увеличить
                    </button>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Counter />);
    </script>

</body>
</html>
